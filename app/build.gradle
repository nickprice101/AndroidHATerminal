plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = System.getenv("CI_VERSION_CODE")
def ciVersionName = System.getenv("CI_VERSION_NAME")
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = keystorePath && keystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.example.androidhaterminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.androidhaterminal"
        minSdk 21
        targetSdk 34
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 1
        versionName ciVersionName ?: "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.camera:camera-core:1.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
}
